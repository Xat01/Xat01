<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" width="1440" height="360">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FF87" stroke-width="0.4" opacity="0.12"/>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.08"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#00FF87" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>

    <style type="text/css"><![CDATA[
      @keyframes scanline-move {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(360px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes data-stream {
        0% { transform: translateY(-180px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      @keyframes radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .scanline-overlay {
        animation: scanline-move 10s linear infinite;
      }
      .pulse-glow {
        animation: pulse 3s ease-in-out infinite;
      }
      .blink-cursor {
        animation: blink 1.2s step-end infinite;
      }
      .slide-up {
        animation: slide-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      .float {
        animation: float 4s ease-in-out infinite;
      }
      .rotate-slow {
        animation: rotate-slow 25s linear infinite;
        transform-origin: center;
      }
      .data-stream {
        animation: data-stream 4s linear infinite;
      }
      .radar-sweep {
        animation: radar-sweep 5s linear infinite;
        transform-origin: center bottom;
      }

      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.2s; }
      .delay-3 { animation-delay: 0.3s; }
      .delay-4 { animation-delay: 0.4s; }
      .delay-5 { animation-delay: 0.5s; }
      .delay-6 { animation-delay: 0.6s; }

      .stream-1 { animation-delay: 0s; }
      .stream-2 { animation-delay: 0.7s; }
      .stream-3 { animation-delay: 1.4s; }
      .stream-4 { animation-delay: 2.1s; }
      .stream-5 { animation-delay: 2.8s; }
      .stream-6 { animation-delay: 3.5s; }
    ]]></style>
  </defs>

  <rect width="1440" height="360" fill="url(#bg-gradient)"/>
  <ellipse cx="720" cy="180" rx="550" ry="220" fill="url(#center-glow)"/>
  <rect width="1440" height="360" fill="url(#grid)"/>
  <rect class="scanline-overlay" width="1440" height="360" fill="url(#scanlines)" pointer-events="none"/>
  <line x1="0" y1="0" x2="1440" y2="0" stroke="url(#accent-gradient)" stroke-width="1.5" opacity="0.7"/>

  <!-- Left Panel -->
  <g class="slide-up delay-1" transform="translate(50, 50)">
    <rect x="0" y="0" width="360" height="32" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="16" r="5" fill="#FF5F57"/>
    <circle cx="32" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="16" r="5" fill="#28CA42"/>
    <text x="180" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">xat01@mission-control:~$</text>

    <g transform="translate(0, 44)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FF87" font-weight="600">SYSTEM SPECIFICATIONS</text>
      <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#30363D">━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

      <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#E6EDF3">
        <text x="0" y="36"><tspan fill="#00FF87">▸</tspan> HOST: <tspan fill="#8A2BE2">XAT01-MISSION-CONTROL</tspan></text>
        <text x="0" y="52"><tspan fill="#00FF87">▸</tspan> KERNEL: <tspan fill="#FF6B35">6.8.0-custom</tspan></text>
        <text x="0" y="68"><tspan fill="#00FF87">▸</tspan> UPTIME: <tspan fill="#00D4AA" id="uptime">4Y 237D 14H 32M</tspan></text>
        <text x="0" y="84"><tspan fill="#00FF87">▸</tspan> LOAD: <tspan fill="#FFBD2E" id="load">[0.23, 0.41, 0.38]</tspan></text>
        <text x="0" y="100"><tspan fill="#00FF87">▸</tspan> MEMORY: <tspan fill="#00FF87">32.4 GiB</tspan> / 64 GiB</text>
        <text x="0" y="116"><tspan fill="#00FF87">▸</tspan> GPU: <tspan fill="#8A2BE2">RTX 4090 (24 GB)</tspan></text>
        <text x="0" y="132"><tspan fill="#00FF87">▸</tspan> NETWORK: <tspan fill="#00D4AA">10 Gbps Fiber</tspan></text>
      </g>
    </g>

    <g transform="translate(0, 176)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FF87" font-weight="600">ACTIVE OPERATIONS</text>
      <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#30363D">━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

      <g font-family="'JetBrains Mono', monospace" font-size="9">
        <text x="0" y="36"><tspan fill="#00FF87">●</tspan> <tspan fill="#E6EDF3">MEMORA</tspan> <tspan fill="#30363D">MCP Memory Server</tspan> <tspan fill="#30363D">░░░░░░░░░░</tspan> <tspan fill="#28CA42">OPERATIONAL</tspan></text>
        <text x="0" y="52"><tspan fill="#00FF87">●</tspan> <tspan fill="#E6EDF3">PULSESOC</tspan> <tspan fill="#FF6B35">Async Recon Engine</tspan> <tspan fill="#30363D">░░░░░░░░░░</tspan> <tspan fill="#28CA42">OPERATIONAL</tspan></text>
        <text x="0" y="68"><tspan fill="#FFBD2E">●</tspan> <tspan fill="#E6EDF3">VEYRON</tspan> <tspan fill="#8A2BE2">AppSec Orchestrator</tspan> <tspan fill="#30363D">████████░░</tspan> <tspan fill="#FFBD2E">IN DEVELOPMENT</tspan></text>
        <text x="0" y="84"><tspan fill="#28CA42">●</tspan> <tspan fill="#E6EDF3">AEGISVAULT</tspan> <tspan fill="#00D4AA">Cryptographic Vault</tspan> <tspan fill="#30363D">██████████</tspan> <tspan fill="#28CA42">COMPLETE</tspan></text>
      </g>
    </g>
  </g>

  <!-- Center Identity -->
  <g class="slide-up delay-2" transform="translate(720, 110)" text-anchor="middle">
    <g class="radar-sweep" transform="translate(0, -15)">
      <ellipse cx="0" cy="0" rx="110" ry="55" fill="none" stroke="#00FF87" stroke-width="1" stroke-dasharray="6,4" opacity="0.25"/>
      <ellipse cx="0" cy="0" rx="75" ry="38" fill="none" stroke="#00FF87" stroke-width="1" stroke-dasharray="5,5" opacity="0.18"/>
      <path d="M0,-55 L0,0" stroke="url(#accent-gradient)" stroke-width="2" filter="url(#glow)"/>
    </g>

    <g class="float rotate-slow">
      <polygon points="0,-65 56.3,-32.5 56.3,32.5 0,65 -56.3,32.5 -56.3,-32.5"
               fill="none" stroke="url(#accent-gradient)" stroke-width="2.5" filter="url(#glow)"/>
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
               fill="url(#accent-gradient)" opacity="0.12"/>
    </g>

    <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#00FF87" filter="url(#text-glow)">
      XAT01
    </text>

    <g transform="translate(0, 28)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E6EDF3" letter-spacing="3">
        <tspan class="blink-cursor" id="cursor">|</tspan>
      </text>
    </g>

    <g transform="translate(0, 54)" font-family="'JetBrains Mono', monospace" font-size="9">
      <text x="-130" y="0" fill="#00FF87">[</text>
      <text x="-122" y="0" fill="#E6EDF3">CYBERSECURITY ENGINEER</text>
      <text x="14" y="0" fill="#00FF87">]</text>

      <text x="32" y="0" fill="#00FF87">[</text>
      <text x="40" y="0" fill="#E6EDF3">AI INFRASTRUCTURE ARCHITECT</text>
      <text x="202" y="0" fill="#00FF87">]</text>

      <text x="220" y="0" fill="#00FF87">[</text>
      <text x="228" y="0" fill="#E6EDF3">SYSTEMS PROGRAMMER</text>
      <text x="346" y="0" fill="#00FF87">]</text>
    </g>

    <g transform="translate(0, 80)">
      <rect x="-140" y="-10" width="85" height="20" rx="10" fill="#0D1117" stroke="#00FF87" stroke-width="1" opacity="0.8"/>
      <text x="-97.5" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00FF87" font-weight="600">BUILDER</text>

      <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#0D1117" stroke="#FF6B35" stroke-width="1" opacity="0.8"/>
      <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF6B35" font-weight="600">BREAKER</text>

      <rect x="55" y="-10" width="85" height="20" rx="10" fill="#0D1117" stroke="#00D4AA" stroke-width="1" opacity="0.8"/>
      <text x="97.5" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00D4AA" font-weight="600">DEFENDER</text>
    </g>
  </g>

  <!-- Right Panel -->
  <g class="slide-up delay-3" transform="translate(1030, 50)">
    <rect x="0" y="0" width="360" height="32" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="16" r="5" fill="#FF5F57"/>
    <circle cx="32" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="16" r="5" fill="#28CA42"/>
    <text x="180" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">TELEMETRY █ LIVE</text>

    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow"/>
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">PORTS/SEC</text>
      <text x="10" y="48" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00FF87" filter="url(#text-glow)">79.3K</text>
      <text x="10" y="64" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">PEAK THROUGHPUT</text>

      <rect x="190" y="0" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow delay-1"/>
      <text x="200" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">TEST COVERAGE</text>
      <text x="200" y="48" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00D4AA" filter="url(#text-glow)">94.2%</text>
      <text x="200" y="64" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">LINE / 89.7% BRANCH</text>

      <rect x="0" y="89" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow delay-2"/>
      <text x="10" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">LATENCY P99</text>
      <text x="10" y="137" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#8A2BE2" filter="url(#text-glow)"><45MS</text>
      <text x="10" y="153" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">LOCAL EMBEDDINGS</text>

      <rect x="190" y="89" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow delay-3"/>
      <text x="200" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">DOCKER IMAGE</text>
      <text x="200" y="137" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#FF6B35" filter="url(#text-glow)">47MB</text>
      <text x="200" y="153" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">DISTROLESS RUNTIME</text>

      <rect x="0" y="178" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow delay-4"/>
      <text x="10" y="198" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">ACTIVE REPOS</text>
      <text x="10" y="226" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#FFBD2E" filter="url(#text-glow)" id="repo-count">6</text>
      <text x="10" y="242" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">OPERATIONAL</text>

      <rect x="190" y="178" width="170" height="74" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" class="pulse-glow delay-5"/>
      <text x="200" y="198" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">CERT PURSUIT</text>
      <text x="200" y="226" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00D4AA" filter="url(#text-glow)">2</text>
      <text x="200" y="242" font-family="'JetBrains Mono', monospace" font-size="7" fill="#28CA42">ISC2 CC + CISCO JCA</text>
    </g>

    <g transform="translate(0, 270)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00FF87" opacity="0.5">
      <text x="0" y="0">INCOMING DATA STREAMS</text>
      <g transform="translate(0, 16)">
        <text class="data-stream stream-1" x="0" y="0">► MEMORA: 1,247 vectors indexed...</text>
        <text class="data-stream stream-2" x="0" y="14">► PULSESOC: 254 hosts scanned...</text>
        <text class="data-stream stream-3" x="0" y="28">► VEYRON: 47 findings triaged...</text>
        <text class="data-stream stream-4" x="0" y="42">► AEGISVAULT: 0 integrity violations...</text>
        <text class="data-stream stream-5" x="0" y="56">► GITHUB: 23 commits this week...</text>
        <text class="data-stream stream-6" x="0" y="70">► LAB: k3s cluster healthy...</text>
      </g>
    </g>
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(0, 334)">
    <rect width="1440" height="26" fill="#030712" opacity="0.9"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#30363D" stroke-width="1"/>

    <text x="25" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">
      STATUS: <tspan fill="#00FF87">● OPERATIONAL</tspan>  |  LOCATION: <tspan fill="#00D4AA">DUBAI, UAE</tspan>  |  TZ: <tspan fill="#8A2BE2">GST (UTC+4)</tspan>  |  LAST DEPLOY: <tspan fill="#FFBD2E">2026-01-15 14:23:12Z</tspan>
    </text>

    <text x="1180" y="17" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B949E">
      <tspan fill="#00FF87">█</tspan> SECURE  <tspan fill="#00D4AA">█</tspan> ENCRYPTED  <tspan fill="#8A2BE2">█</tspan> AIR-GAPPED  <tspan fill="#FF6B35">█</tspan> MONITORED
    </text>
  </g>

  <g stroke="#00FF87" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M25,25 L25,50 L50,50"/>
    <path d="M1415,25 L1415,50 L1390,50"/>
    <path d="M25,335 L25,310 L50,310"/>
    <path d="M1415,335 L1415,310 L1390,310"/>
  </g>

  <g opacity="0.35">
