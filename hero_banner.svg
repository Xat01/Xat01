    <circle cx="980" cy="280" r="1.2" fill="#00FF87" class="float" style="animation-delay: 1.8s; animation-duration: 5s;"/>
    <circle cx="1230" cy="295" r="0.8" fill="#00D4AA" class="float" style="animation-delay: 2.2s; animation-duration: 4s;"/>
